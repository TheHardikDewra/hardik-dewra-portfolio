<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG card - iteration 1</title>
<link rel="stylesheet" href="/vendor/tokens.css">
<link rel="stylesheet" href="/vendor/base.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; background: var(--navy); color: var(--paper); font-family: var(--f-sans); overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; font: 500 16px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted-on-navy); }
  .top b { color: var(--paper); font: 600 22px/1 var(--f-sans); letter-spacing: -.02em; text-transform: none; }
  h1 { margin: 0; font-weight: 600; font-size: 84px; line-height: 1.04; letter-spacing: -.05em; }
  .plate { background: var(--gold); color: var(--navy); border-radius: 8px; padding: 0 .1em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--line-on-navy-strong); padding-top: 24px;
    font: 500 17px/1.4 var(--f-mono); color: var(--muted-on-navy); letter-spacing: .02em; }
  .foot span:last-child { color: var(--paper); }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><b>Hardik Dewra</b><span>Landing page designer · Figma → Framer</span></div>
    <h1>Your next landing page, live in <span class="plate">five working days.</span></h1>
    <div class="foot"><span>Copy, design and build by one person</span><span>hardikdewra.vercel.app</span></div>
  </div>
</body>
</html>
